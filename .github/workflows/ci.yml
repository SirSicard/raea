# raea's public CI (docs/public-first.feature PF5), on GitHub's hosted runners only: it runs code from pull requests,
# so it never touches a self-hosted machine. What needs this Mac's GPU, VideoToolbox or audio (P26, UI parity, the
# sound gates) stays the maintainers' L1/L2 (docs/agents.md); this is the part anyone can read and rerun.
#   every pull request and push to main   guard (names and secrets), L0's repo-wide gates, cargo check of the engine
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # a pull request's newer push replaces its run; main's pushes each finish (on a busy main, cancelling meant none did)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  guard:
    # what this change adds names no home folder, agent path or session, and holds no secret (tools/public-guard.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        # GitHub's release host answered 504 for minutes at a time on 11-08, through every retry; the same version's
        # container image on ghcr.io is the fallback
        run: |
          v=8.30.1
          curl -fsSL --retry 3 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks \
            || { c=$(docker create ghcr.io/gitleaks/gitleaks:v$v) && sudo docker cp "$c:/usr/bin/gitleaks" /usr/local/bin/gitleaks && docker rm "$c"; }
          gitleaks version
      - name: public-guard
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git rev-list --max-parents=0 HEAD | tail -1)
          bash tools/public-guard.sh range "$base..HEAD"

  gates:
    # L0's repo-wide steps (tools/agents/check's list, the ones that need no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: tools
        run: |
          rustup show active-toolchain
          sudo apt-get update && sudo apt-get install -y ripgrep
          cargo install --locked cargo-shear cargo-dupes
      - name: layers
        run: bash tools/layers.sh
      - name: names
        run: bash tools/names.sh
      - name: size
        run: bash tools/size.sh
      - name: one-version
        run: bash tools/one-version.sh
      - name: no-void
        run: bash tools/no-void.sh
      - name: dupes
        run: bash tools/dupes.sh
      - name: unused dependencies
        run: cargo shear --color never --deny-warnings
      - name: tasks
        run: bash tools/rask.sh check
      - name: sdk packages
        # sdk-coverage reads csstype and @types/react from them; node_modules aren't in git
        run: cd sdk/raea && bun install --frozen-lockfile
      - name: sdk coverage
        run: bash tools/sdk-coverage --check
      - name: sdk props
        run: bash tools/sdk-props.sh --check
      - name: taxonomy
        run: bash tools/taxonomy.sh --check

  engine:
    # a fresh clone builds as the README says (public #14): the toolchain from rust-toolchain.toml, --locked
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libasound2-dev libfontconfig1-dev libvulkan-dev libudev-dev nasm
      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja nasm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --locked -p raea-cli --tests
      - name: unit tests (the crates with no GPU or media device)
        # debug info off: with it the test binaries of the app crates filled 27 GB of a runner's disk (#90)
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked -p raea-io-media -p raea-core-fonts -p raea-native -p raea-core-brief -p raea-core-k -p raea-bundle -p raea-app-check -p raea-app-check-flash -p raea-app-workspace -p raea-app-tools -p raea-app-targets
