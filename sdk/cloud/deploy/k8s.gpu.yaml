# A GPU render worker for raea cloud on Kubernetes (docs/cloud.feature CL13, CL15): the same image on a node with an
# NVIDIA GPU, no agent and no volume, that k8s.yaml's server hands its renders to. The node needs NVIDIA's driver and
# its device plugin (or the GPU Operator); the image asks for the graphics capability, so Vulkan sees the card.
#
#   kubectl create secret generic raea-cloud-gpu --from-literal=RAEA_CLOUD_TOKEN=$(openssl rand -hex 32)
#   kubectl apply -f deploy/k8s.gpu.yaml
#
# then uncomment RAEA_CLOUD_GPU_URL and RAEA_CLOUD_GPU_TOKEN in k8s.yaml and apply it again. RAEA_CLOUD_DEVICE=gpu
# makes a pod whose GPU doesn't open fail to start, so it never renders on its CPU unnoticed. Scale it to 0 replicas
# between batches of renders (kubectl scale deploy/raea-cloud-gpu --replicas=0); the server then fails its renders
# with a line saying the worker didn't answer, unless it sets RAEA_CLOUD_GPU_FALLBACK=cpu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raea-cloud-gpu
spec:
  # one replica: a render job is followed on the pod that runs it
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: raea-cloud-gpu }
  template:
    metadata:
      labels: { app: raea-cloud-gpu }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: raea
          image: ghcr.io/YOUR-ORG/raea-cloud:0.1.1
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: raea-cloud-gpu }
          env:
            - { name: RAEA_CLOUD_DEVICE, value: gpu }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: "4", memory: 8Gi }
            limits: { memory: 16Gi, nvidia.com/gpu: 1 }
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: raea-cloud-gpu
spec:
  selector: { app: raea-cloud-gpu }
  ports:
    - { port: 8080, targetPort: 8080 }
