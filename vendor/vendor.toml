[vello_encoding]
path = "vendor/vello_encoding"
upstream = "crates.io:0.11.0"
kind = "patch"
reason = "bump buffer sizes set by the embedder (vello#1861's BumpAllocationSizes), not 165 MiB of defaults, grown with the target past 1080p (bump_sizes_for: ptcl holds every tile's initial allocation, which alone filled 99% of a fixed 2M at 4K), and back at the defaults while set_bump_full is on (a frame that came out all black drawn again); glyph tops for the CoreGraphics y-map (RAEA_PAGE_CG_YMAP); a resolve with no images keeps the image atlas (resolve.rs: a solid-only scene reported 0x0, the renderer swapped in a 1x1 atlas and every cached image then drew blank); a full image atlas lets go of what the resolve hasn't used, the longest unused first, and is then packed again with the resolve's images alone, before an image is left out, and the images left out are counted (take_images_left_out: raea-page's layers are new images in every frame, the atlas kept the last two frames' and a page of ten frame-sized layers drew without its nearest)"
exit = "vello#1861 in a release; the y-map hook stays ours"

