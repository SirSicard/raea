# Every crate raea carries a copy of: where it came from, why it's here, and what lets us drop it.
# tools/vendor reads this (ls, diff, check, bump). Keep the format plain: one [name] table per crate, one
# `key = "value"` per line, no inline tables or arrays.
#
#   path      the copy in this repo
#   upstream  crates.io:<version>, or git:<url>@<rev>; the version our changes were made on
#   kind      bump  — only Cargo.toml differs (a dependency's version moved); drop it when upstream releases the same
#             patch — source changes, each marked with `raea:` (muxide's older ones say `raea patch`)
#   reason    one line: what we changed and why
#   exit      what lets us drop the copy (an upstream PR or release), or "none" when there is no upstream equivalent

[muxide]
path = "vendor/muxide"
upstream = "crates.io:0.2.5"
kind = "patch"
reason = "AAC priming written as an edit list; AV1 av1C read decoder_model_info only with timing info (rav1e streams were refused); H.265 hvcC from the SPS's RBSP, so Main10 is declared 10-bit"
exit = "a muxide release with the edit list and the hvcC RBSP read (0.5.0 has the AV1 fix); then move to it and drop the copy"

